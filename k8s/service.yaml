apiVersion: v1
kind: Service
metadata:
  name: ai-command-center
  labels:
    app: ai-command-center
spec:
  type: ClusterIP
  selector:
    app: ai-command-center
  ports:
    - name: http
      port: 80
      targetPort: 8000
      protocol: TCP
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-command-center
  labels:
    app: ai-command-center
---
apiVersion: v1
kind: Secret
metadata:
  name: ai-command-center-secrets
  labels:
    app: ai-command-center
type: Opaque
stringData:
  OPENAI_API_KEY: "REPLACE_WITH_AZURE_OPENAI_KEY"
  LOG_LEVEL: "INFO"